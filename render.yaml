# Render Blueprint — one-click deploy of RingBack AI.
#
# Notes:
#  * After first deploy, set the ASSEMBLYAI_API_KEY secret in the Render
#    dashboard (Environment → Secret Files) so it is never committed.
#  * If your service gets a different URL, update PUBLIC_BASE_URL to match —
#    AssemblyAI's Voice Agent calls the HTTP tools on it.
services:
  - type: web
    name: ringback-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://ringback-ai.onrender.com
      - key: SEED_DEMO
        value: "true"
      - key: AAI_ANALYTICS_MODEL
        value: gemini-2.5-flash-lite
      - key: ASSEMBLYAI_VOICE
        value: alba